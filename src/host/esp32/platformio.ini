; The reconstruction on an ESP32-S3 - the LilyGO T-Deck Pro (docs/host-tdeck-pro.md,
; src/host/esp32/README.md).  ESP-IDF through PlatformIO, which installs it.
;
;   ~/.platformio/penv/Scripts/pio run -d src/host/esp32                       # build
;   ~/.platformio/penv/Scripts/pio run -d src/host/esp32 -t upload --upload-port COM4
;
; The ROM's objects go into their own partition as a baked image
; (frames/ROMImport.h), written separately: the README says how.

[platformio]
src_dir = main

[env:tdeck-pro]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456
board_build.partitions = partitions.csv
board_build.flash_mode = qio
monitor_speed = 115200
; (the ESP32-S3's own USB port has no baud rate: at the default, esptool changes
;  it anyway, and that step failed on the owner's board - "No serial data")
upload_speed = 115200
extra_scripts = pre:upload_objects.py
