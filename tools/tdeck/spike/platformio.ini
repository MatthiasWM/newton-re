; The T-Deck Pro device spike (tools/tdeck/README.md, docs/host-tdeck-pro.md):
; a small ESP-IDF program, not the OS, that measures what the port needs to
; know - the board, the memory's speed, the panel's refresh times, raw touch
; and keyboard events - and prints it over the USB serial port.
;
;   ~/.platformio/penv/Scripts/pio run -d tools/tdeck/spike -t upload --upload-port COM4
;   python tools/tdeck/serialcapture.py COM4 60
;
; The board definition is Espressif's DevKitC-1 with the T-Deck Pro's 16 MB of
; flash; the octal PSRAM and the USB console are set in sdkconfig.defaults.

[env:tdeck-pro]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions.csv
board_build.flash_mode = qio
monitor_speed = 115200
